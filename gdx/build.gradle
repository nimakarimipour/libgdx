apply plugin: "java"
apply plugin: "net.ltgt.errorprone"

if(JavaVersion.current().isJava9Compatible()) {
	compileJava {
		options.release = versions.java
	}
} else {
	sourceCompatibility = versions.java
	targetCompatibility = versions.java
}

sourceSets.main.java.srcDirs = ["src"]
sourceSets.main.resources.srcDirs = ["res"]
sourceSets.test.java.srcDirs = ["test"]

compileJava {
	options.fork = true
	options.incremental = true
}

jar {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

dependencies {
	testImplementation libraries.junit
	api "com.badlogicgames.gdx:gdx-jnigen-loader:2.3.1"

	annotationProcessor "com.uber.nullaway:nullaway:0.10.7-LOCAL"
	annotationProcessor "edu.ucr.cs.riple.annotator:annotator-scanner:1.3.6-alpha-2"
	annotationProcessor "edu.ucr.cs.riple.checkers:ExhaustiveFixSerializer:1.0-SNAPSHOT"
	annotationProcessor "edu.ucr.cs.riple.checkers:NullUnmarkedCollector:1.0-SNAPSHOT"

	// Optional, some source of nullability annotations.
	// Not required on Android if you use the support
	// library nullability annotations.
	compileOnly "com.google.code.findbugs:jsr305:3.0.2"

	errorprone "com.google.errorprone:error_prone_core:2.16"
	errorproneJavac "com.google.errorprone:javac:9+181-r4173-1"
}

test {
	testLogging {
		events "passed", "skipped", "failed", "standardOut", "standardError"
	}
}

processResources.duplicatesStrategy = DuplicatesStrategy.EXCLUDE

apply plugin: "com.badlogicgames.gdx.gdx-jnigen"
jnigen {
	sharedLibName = "gdx"
	temporaryDir = "../target/native"
	all {
		cppExcludes = ["iosgl/**"]
	}
	add(Windows, x32)
	add(Windows, x64)
	add(Linux, x64)
	add(Linux, x32, ARM)
	add(Linux, x64, ARM)
	add(Android) {
		linkerFlags += " -llog"
	}
	add(MacOsX, x64)
	add(MacOsX, x64, ARM)
	add(IOS) {
		headerDirs = ["iosgl"]
		cppExcludes = []
	}
	robovm {
		extraLib("libs/ObjectAL.xcframework/ios-arm64_armv7/libObjectAL.a", "device")
		extraLib("libs/ObjectAL.xcframework/ios-arm64_x86_64-simulator/libObjectAL.a", "simulator")
	}
}

import net.ltgt.gradle.errorprone.CheckSeverity

tasks.withType(JavaCompile) {
	// remove the if condition if you want to run NullAway on test code
	if (!name.toLowerCase().contains("test")) {
		options.errorprone.disableAllChecks = true
		options.errorprone.disableAllWarnings = true
		options.errorprone {
			check("NullAway", CheckSeverity.ERROR)
			check("AnnotatorScanner", CheckSeverity.ERROR)
			check("ExhaustiveFixSerializer", CheckSeverity.OFF)
			check("NullUnmarkedCollector", CheckSeverity.OFF)
			option("NullAway:AnnotatedPackages", "com.badlogic")
			option("NullAway:SerializeFixMetadata", "true")
			option("NullAway:FixSerializationConfigPath", "/tmp/NullAwayFix/nullaway.xml")
			option("AnnotatorScanner:ConfigPath", "/tmp/NullAwayFix/scanner.xml")
		}
	}
	options.compilerArgs << "-Xmaxerrs" << "100000"
	options.compilerArgs << "-Xmaxwarns" << "100000"
}
